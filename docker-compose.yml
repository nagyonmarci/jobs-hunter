services:
  postgres:
    image: postgres:16-alpine
    container_name: jobsearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-directus}
      POSTGRES_USER: ${POSTGRES_USER:-directus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-directus-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  importer:
    build:
      context: .
      target: app
    container_name: jobsearch-importer
    restart: unless-stopped
    command: ["scripts/import-server.js"]
    ports:
      - "4180:4180"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-directus}
      POSTGRES_USER: ${POSTGRES_USER:-directus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-directus-local-password}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}
      IMPORT_SERVER_PORT: 4180
    volumes:
      - cv_data:/app/data

volumes:
  postgres_data:
    name: seg-ts-a-linkedin-com-on_postgres_data
    external: true
  cv_data:
